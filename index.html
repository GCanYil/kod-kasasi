<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kod Kasası</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d2330;--mut:#6b7280;--panel:#ffffff;--panel2:#f2f1ed;--line:#e3e1d9;--acc:#4353d6;--outbg:#fafaf7;--err:#c53030;--ok:#1f8a5b;--b:#b45309;--soft:#e9ecfd;--errsoft:var(--errsoft);--okline:var(--okline);--oksoft:var(--oksoft);--edbg:#ffffff;--bilgiline:var(--bilgiline);--bilgibg:var(--bilgibg);--acch:var(--acch);--accyazi:#ffffff;--sec:var(--sec);--golge:var(--golge);--hk:#008000;--hb:#008000;--hm:#ba2121;--hn:#0a7d54;--hy:#6b8a8a;--accd:var(--acc);--kir:var(--acc)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 line-height:1.5;font-size:17px;padding-bottom:80px}
code,pre,textarea,.mono{font-family:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace}
code{color:var(--kir);font-size:.95em;font-weight:600}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2px solid var(--line);padding:12px 16px}
.ust{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
h1{font-size:26px;color:var(--kir);font-family:Consolas,"SF Mono",Menlo,monospace;margin-right:auto}
.parcalar{display:flex;gap:8px;align-items:center}
.parcalar span.et{color:var(--mut);font-size:14px;margin-right:4px}
.parca{min-width:54px;height:40px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;
 font-family:Consolas,"SF Mono",Menlo,monospace;font-weight:800;font-size:19px;color:var(--mut);padding:0 8px;background:var(--panel)}
.parca.var{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--soft)}
nav{max-width:1180px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;font-weight:700;padding:8px 14px;border-radius:10px;border:2px solid var(--line);
 background:var(--panel);color:var(--fg);cursor:pointer}
nav button .say{color:var(--mut);font-weight:400;margin-left:6px}
nav button.sec{border-color:var(--kir);color:var(--kir);background:var(--soft)}
nav button.bitti .say{color:var(--ok);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.uyari{border:2px solid var(--acc);border-radius:12px;padding:12px 16px;background:var(--soft);font-size:15px}
.uyari.kotu{border-color:var(--err);background:var(--errsoft)}
.gorev{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 8px var(--golge)}
.gorev.tamam{border-color:var(--okline)}
.gbas{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.gbas h2{font-size:22px}
.kick{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--accyazi);background:var(--acc);padding:3px 10px;border-radius:6px}
.kick.hat{background:var(--kir);color:var(--accyazi)}
.gorev.bilgi{border-color:var(--bilgiline);background:var(--bilgibg)}
button.ipb{font:inherit;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--line);background:none;color:var(--b);cursor:pointer;vertical-align:1px}
button.ipb:hover{border-color:var(--b)}
.ipucu{margin:8px 0 4px;border-left:4px solid var(--b);background:var(--panel2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:16px}
.ipucu pre{margin-top:6px;font-size:16px;line-height:1.4;color:var(--fg);overflow-x:auto}
.cubuk i{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:13px;font-style:normal;color:var(--mut)}
.cubuklar{margin-bottom:30px}
.tik{margin-left:auto;color:var(--ok);font-weight:800;font-size:15px;display:none}
.gorev.tamam .tik{display:block}
.giris{color:var(--fg)}
ol.adim{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:8px}
ol.adim li{counter-increment:s;padding-left:40px;position:relative}
ol.adim li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--acc);
 color:var(--accyazi);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.iki{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.iki{grid-template-columns:minmax(0,1fr)}}
.lbl{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.04em;margin-bottom:4px}
textarea{width:100%;min-height:230px;background:var(--edbg);color:var(--fg);border:2px solid var(--line);border-radius:12px;
 padding:12px 14px;font-size:17px;line-height:1.45;resize:vertical;tab-size:4}
textarea:focus{outline:none;border-color:var(--accd)}
pre.kod{background:var(--outbg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;overflow-x:auto}
pre.ornek{background:var(--outbg);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.4;color:var(--mut);overflow-x:auto}
.cikti{background:var(--outbg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:110px;max-height:340px;overflow:auto;
 font-family:Consolas,"SF Mono",Menlo,monospace;font-size:16px;white-space:pre-wrap;word-break:break-word}
.cikti .hata{color:var(--err)}
.cikti input{font:inherit;background:var(--edbg);color:var(--kir);border:2px solid var(--accd);border-radius:6px;padding:1px 8px;min-width:200px;outline:none}
.cikti .gir{color:var(--kir);font-weight:700}
.cikti .sis{color:var(--mut);font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.b{font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);
 color:var(--fg);cursor:pointer}
button.b:hover:not(:disabled){border-color:var(--accd)}
button.b.ana{background:var(--acc);color:var(--accyazi);border-color:var(--accd)}
button.b:disabled{opacity:.45;cursor:default}
.sonuc{font-weight:600;font-size:16px}
.sonuc.iyi{color:var(--ok)}.sonuc.kotu{color:var(--err)}
.secenek{display:flex;flex-direction:column;gap:8px}
.secenek button{font:inherit;text-align:left;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
.secenek button:hover{border-color:var(--accd)}
.secenek button.dogru{border-color:var(--ok);background:var(--oksoft);font-weight:700}
.secenek button.yanlis{border-color:var(--err);opacity:.6}
.izgara{display:grid;grid-template-columns:22px repeat(10,1fr);gap:2px;max-width:330px}
.izgara div{aspect-ratio:1;border-radius:3px;background:var(--panel2);font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:center;
 font-family:Consolas,"SF Mono",Menlo,monospace}
.izgara .no{background:none}
.izgara .dolu{background:var(--acc)}
.cubuklar{display:flex;align-items:flex-end;gap:10px;height:190px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.cubuk{flex:1;max-width:60px;background:var(--acc);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.cubuk span{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:14px;font-family:Consolas,"SF Mono",Menlo,monospace}
.kartlar{display:flex;flex-wrap:wrap;gap:10px}
.kart{border:2px solid var(--accd);border-radius:12px;padding:10px 16px;background:var(--panel2);min-width:110px;text-align:center}
.kart b{display:block;font-size:17px}.kart span{font-size:28px;font-weight:800;color:var(--kir);font-family:Consolas,"SF Mono",Menlo,monospace}
.bos{color:var(--mut);font-size:15px}
.odul{border:3px solid var(--acc);border-radius:16px;padding:20px 22px;background:var(--soft);text-align:center}
.odul .buyuk{font-size:44px;font-weight:800;color:var(--kir);font-family:Consolas,"SF Mono",Menlo,monospace;letter-spacing:.08em}
.kasa{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding:30px 20px}
.kasa input{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:30px;text-align:center;letter-spacing:.1em;background:var(--edbg);color:var(--kir);
 border:3px solid var(--line);border-radius:12px;padding:10px 14px;width:min(420px,100%);outline:none;text-transform:uppercase}
.kasa input:focus{border-color:var(--accd)}
.acik{font-size:54px;font-weight:800;color:var(--ok)}
.kucuk{font-size:14px;color:var(--mut)}
a.sifirla{color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline}

h2{letter-spacing:-.01em}
button.b,nav button,.secenek button{transition:border-color .12s,background .12s}
button.b.ana:hover:not(:disabled){background:var(--acch)}
.gorev{border-width:1px}.gorev.tamam{border-width:2px}
pre.kod,.cikti,textarea,pre.ornek{border-width:1px}
textarea:focus{box-shadow:0 0 0 3px var(--soft)}
.hk{color:var(--hk);font-weight:700}.hb{color:var(--hb)}.hm{color:var(--hm)}.hn{color:var(--hn)}.hy{color:var(--hy);font-style:italic}
.ed{position:relative}
.ed textarea{display:block;color:transparent;caret-color:var(--fg);background:var(--edbg)}
.ed textarea::selection{color:transparent;background:var(--sec)}
.ed pre.hl{position:absolute;inset:0;margin:0;pointer-events:none;overflow:hidden;white-space:pre;border:1px solid transparent;border-radius:12px;
 padding:12px 14px;font-size:17px;line-height:1.45;tab-size:4;color:var(--fg)}

#temaB{font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
#temaB:hover{border-color:var(--acc)}
#temaSec{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;padding:28px 16px}
#temaSec.acik{display:block}
#temaSec .ic{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#temaSec h2{font-size:30px}
#temaSec .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tk{font:inherit;text-align:left;border-radius:16px;border:3px solid transparent;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;outline:1px solid rgba(128,128,128,.35)}
.tk:hover,.tk:focus{outline:3px solid var(--acc)}
.tk.secili{outline:3px solid var(--acc)}
.tk b{font-size:20px}
.tk pre{font-size:15px;line-height:1.45;border-radius:10px;padding:10px 12px;white-space:pre;overflow:hidden}
.tk .dg{display:inline-block;align-self:flex-start;font-size:14px;font-weight:700;border-radius:8px;padding:5px 12px}
</style>
</head>
<body>
<header>
 <div class="ust">
  <h1>Kod Kasası</h1>
  <div class="parcalar" id="parcalar"></div>
  <button id="temaB" type="button">Tema</button>
 </div>
 <nav id="nav"></nav>
</header>
<main id="ana"></main>
<div id="temaSec"><div class="ic"><h2 id="temaBas"></h2><p class="kucuk" id="temaAlt"></p><div class="tl" id="temaListe"></div></div></div>
